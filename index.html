<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Google Search needs a square icon of at least 48x48 at a stable URL; the
         .ico carries 16-256 so tabs pick their own best match. Bump ?v= when the
         artwork changes: browsers cache favicons far more stubbornly than normal
         assets, so returning visitors keep the old one otherwise. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhance Your Black Ops 3 Experience - Clean Ops</title>

        content="Clean Ops is the essential community patch for PC, trying to deliver a safer, smoother, and cheat-free Black Ops 3 Multiplayer.">

    <meta property="og:url" content="https://www.cleanops.dev/">

    <meta property="og:description"
        content="Clean Ops is the essential community patch for PC, trying to deliver a safer, smoother, and cheat-free Black Ops 3 Multiplayer.">
    <meta property="og:image" content="/img/bg-hero.jpg">

</head>
